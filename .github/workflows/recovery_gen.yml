name: Recovery Tree Generator

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'رابط مباشر لملف boot.img'
        required: true
      vendor_boot_url:
        description: 'رابط مباشر لملف vendor_boot.img (اختياري لو مدمج)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install python3 python3-pip python3-setuptools cpia cpio
          pip3 install twrpdtgen

      - name: Download Images
        run: |
          wget ${{ github.event.inputs.boot_url }} -O boot.img
          if [ ! -z "${{ github.event.inputs.vendor_boot_url }}" ]; then
            wget ${{ github.event.inputs.vendor_boot_url }} -O vendor_boot.img
          fi

      - name: Generate Recovery Tree
        run: |
          mkdir output
          python3 -m twrpdtgen boot.img --output output/
          # ملاحظة: twrpdtgen حالياً بيعرف يسحب المعلومات من boot v3/v4 
          # اللي فيها vendor_boot تلقائياً في أغلب الإصدارات الحديثة

      - name: Zip and Upload
        uses: actions/upload-artifact@v4
        with:
          name: recovery-tree
          path: output/*
