name: Recovery Tree Generator FIXED FINAL

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Direct boot.img link'
        required: true
      vendor_boot_url:
        description: 'Direct vendor_boot.img link (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cpio gzip xz-utils curl wget git
          pip3 install --upgrade pip
          pip3 install twrpdtgen

      - name: Get MagiskBoot (REAL FIX)
        run: |
          git clone https://github.com/topjohnwu/Magisk.git
          cd Magisk
          git submodule update --init --recursive
          cd native/libs
          ls

          # محاولة نسخ magiskboot
          find . -name magiskboot -exec cp {} $GITHUB_WORKSPACE/magiskboot \; || true

          cd $GITHUB_WORKSPACE
          chmod +x magiskboot || true

      - name: Download Images (FIX HTML BUG)
        run: |
          echo "Downloading boot..."
          curl -L --fail "${{ github.event.inputs.boot_url }}" -o boot.img

          # تأكد إنه مش HTML
          if file boot.img | grep -q "HTML"; then
            echo "❌ الرابط غلط (HTML file)"
            exit 1
          fi

          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            echo "Downloading vendor_boot..."
            curl -L --fail "${{ github.event.inputs.vendor_boot_url }}" -o vendor_boot.img
          fi

      - name: Unpack Boot
        run: |
          ./magiskboot unpack boot.img || echo "magiskboot failed"

      - name: Generate Tree
        run: |
          mkdir -p output

          if [ -f "vendor_boot.img" ]; then
            python3 -m twrpdtgen boot.img --vendor_boot vendor_boot.img --output output/ || echo "twrpdtgen failed"
          else
            python3 -m twrpdtgen boot.img --output output/ || echo "twrpdtgen failed"
          fi

      - name: FORCE OUTPUT 🔥
        run: |
          mkdir -p output/fallback

          echo "Copying everything..."
          cp -r * output/fallback/ 2>/dev/null || true

          if [ -f "ramdisk.cpio" ]; then
            mkdir -p output/ramdisk
            cd output/ramdisk
            cpio -idmv < ../../ramdisk.cpio || true
            cd ../../
          fi

          echo "Final content:"
          ls -R output

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Recovery_Tree
          path: output/
