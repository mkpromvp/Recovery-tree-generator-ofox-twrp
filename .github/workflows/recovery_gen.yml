name: Recovery Tree Generator Final Boss

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'رابط ملف boot.img'
        required: true
      vendor_boot_url:
        description: 'رابط ملف vendor_boot.img (اختياري)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-setuptools cpio xz-utils gzip curl wget tar lib32z1 lib32ncurses6 git
          
          pip3 install --upgrade pip --break-system-packages
          pip3 install git+https://github.com/twrpdtgen/twrpdtgen.git --break-system-packages

      - name: Install MagiskBoot
        run: |
          echo "Cloning Magisk..."
          git clone https://github.com/topjohnwu/Magisk.git
          
          find Magisk -type f -name magiskboot -exec cp {} ./magiskboot \; || true
          
          chmod +x magiskboot || true
          export PATH=$PWD:$PATH

      - name: Download Images
        run: |
          echo "Downloading boot.img..."
          curl -L --fail -o boot.img "${{ github.event.inputs.boot_url }}"
          
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            echo "Downloading vendor_boot.img..."
            curl -L --fail -o vendor_boot.img "${{ github.event.inputs.vendor_boot_url }}"
          else
            echo "No vendor_boot provided"
          fi

      - name: Verify Images
        run: |
          ls -lh
          file boot.img || true
          file vendor_boot.img || true

      - name: Unpack Boot (MagiskBoot)
        run: |
          echo "Unpacking boot.img..."
          ./magiskboot unpack boot.img || echo "Magiskboot failed"

      - name: Generate Tree
        run: |
          mkdir -p output
          export PATH=$PWD:$PATH

          if [ -f "vendor_boot.img" ]; then
            echo "Using vendor_boot..."
            sudo python3 -m twrpdtgen boot.img --vendor_boot vendor_boot.img --output output/ || echo "twrpdtgen failed"
          else
            echo "Using boot only..."
            sudo python3 -m twrpdtgen boot.img --output output/ || echo "twrpdtgen failed"
          fi

      - name: Fallback (Force Extract 🔥)
        run: |
          echo "Checking output..."

          mkdir -p output/fallback

          if [ ! -d "output" ] || [ -z "$(ls -A output 2>/dev/null)" ]; then
            echo "No tree generated -> forcing extraction"

            # انسخ كل الملفات اللي اتفكت
            cp -r * output/fallback/ 2>/dev/null || true

            # فك ramdisk لو موجود
            if [ -f "ramdisk.cpio" ]; then
              mkdir -p output/ramdisk
              cd output/ramdisk
              cpio -idmv < ../../ramdisk.cpio || true
              cd ../../
            fi

            echo "Fallback extraction DONE"
          else
            echo "Tree generated successfully"
          fi

          echo "Output content:"
          ls -R output || true

      - name: Fix Permissions
        run: |
          sudo chown -R $USER:$USER output/

      - name: Upload Recovery Tree
        uses: actions/upload-artifact@v4
        with:
          name: Recovery_Tree
          path: output/
