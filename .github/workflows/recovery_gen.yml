name: Recovery Tree Generator

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Direct link to boot.img'
        required: true
      vendor_boot_url:
        description: 'Direct link to vendor_boot.img (Optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # تم تصحيح cpia إلى cpio وإضافة أدوات نحتاجها لفك الضغط
          sudo apt-get install -y python3 python3-pip python3-setuptools cpio xz-utils gzip
          pip3 install twrpdtgen --break-system-packages

      - name: Download Images
        run: |
          mkdir input
          curl -L "${{ github.event.inputs.boot_url }}" -o input/boot.img
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            curl -L "${{ github.event.inputs.vendor_boot_url }}" -o input/vendor_boot.img
          fi

      - name: Generate Recovery Tree
        run: |
          mkdir output
          # إذا وجد ملف vendor_boot، الأداة ستحتاجه في الأجهزة الحديثة
          if [ -f "input/vendor_boot.img" ]; then
             python3 -m twrpdtgen input/boot.img --vendor_boot input/vendor_boot.img --output output/
          else
             python3 -m twrpdtgen input/boot.img --output output/
          fi

      - name: Upload Recovery Tree
        uses: actions/upload-artifact@v4
        with:
          name: Recovery_Tree
          path: output/*
