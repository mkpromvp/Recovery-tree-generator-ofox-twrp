name: Recovery Tree Generator FINAL CLEAN

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Direct boot.img link'
        required: true
      vendor_boot_url:
        description: 'Direct vendor_boot.img link (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cpio gzip xz-utils curl wget git

          pip3 install --upgrade pip
          pip3 install twrpdtgen

      - name: Install AIK 🔥
        run: |
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          chmod -R +x AIK

      - name: Download boot.img
        run: |
          echo "Downloading boot..."
          curl -L --fail "${{ github.event.inputs.boot_url }}" -o boot.img

          if file boot.img | grep -q "HTML"; then
            echo "❌ الرابط مش مباشر"
            exit 1
          fi

      - name: Download vendor_boot (optional)
        run: |
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            echo "Downloading vendor_boot..."
            curl -L --fail "${{ github.event.inputs.vendor_boot_url }}" -o vendor_boot.img
          fi

      - name: Unpack boot باستخدام AIK
        run: |
          cd AIK
          ./unpackimg.sh ../boot.img || true
          cd ..

      - name: Generate device tree
        run: |
          mkdir -p output

          if [ -f "vendor_boot.img" ]; then
            python3 -m twrpdtgen boot.img --vendor_boot vendor_boot.img --output output/ || true
          else
            python3 -m twrpdtgen boot.img --output output/ || true
          fi

      - name: Collect everything 🔥
        run: |
          mkdir -p output/final

          echo "Copy AIK files..."
          cp -r AIK/* output/final/ 2>/dev/null || true

          echo "Copy generated tree..."
          cp -r output/* output/final/ 2>/dev/null || true

          echo "DONE FILES:"
          ls -R output

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Recovery_Tree
          path: output/
