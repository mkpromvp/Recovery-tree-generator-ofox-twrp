name: Recovery Tree Generator

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Direct link to boot.img'
        required: true
      vendor_boot_url:
        description: 'Direct link to vendor_boot.img (Optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-setuptools cpio xz-utils gzip
          pip3 install twrpdtgen --break-system-packages

      - name: Download Images
        run: |
          # هنحط الملفات في الـ Root عشان الأداة تلاقيهم مع بعض تلقائياً
          curl -L "${{ github.event.inputs.boot_url }}" -o boot.img
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            curl -L "${{ github.event.inputs.vendor_boot_url }}" -o vendor_boot.img
          fi

      - name: Generate Recovery Tree
        run: |
          # تشغيل الأداة على boot.img فقط وهي هتسحب vendor_boot لو موجود في نفس الفولدر
          mkdir output
          python3 -m twrpdtgen boot.img --output output/

      - name: Upload Recovery Tree
        uses: actions/upload-artifact@v4
        with:
          name: Recovery_Tree
          path: output/*
