name: Recovery Tree Generator Final

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'Direct link to boot.img'
        required: true
      vendor_boot_url:
        description: 'Direct link to vendor_boot.img (Optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-setuptools cpio xz-utils gzip curl wget tar
          pip3 install twrpdtgen --break-system-packages

      - name: Download Tools
        run: |
          # تحميل magiskboot من مصدر بديل وموثوق
          wget https://github.com/tiann/KernelSU/raw/main/kernel/scripts/magiskboot -O magiskboot
          chmod +x magiskboot

      - name: Download Images
        run: |
          # تحميل الملفات مع إضافة -L لاتباع الروابط المختصرة
          curl -fLo boot.img "${{ github.event.inputs.boot_url }}"
          
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            curl -fLo vendor_boot.img "${{ github.event.inputs.vendor_boot_url }}"
          fi

      - name: Pre-process and Generate
        run: |
          mkdir output
          # محاولة فك الضغط يدويًا أولاً لتهيئة البيئة لـ twrpdtgen
          ./magiskboot unpack boot.img || echo "Magiskboot skip"
          
          # تشغيل الأداة (استخدام sudo هنا لحل مشاكل AIK الداخلية)
          sudo python3 -m twrpdtgen boot.img --output output/

      - name: Fix Permissions
        if: always()
        run: |
          # تأكد من وجود المجلد قبل تغيير الملكية
          if [ -d "output" ]; then
            sudo chown -R $USER:$USER output/
          fi

      - name: Upload Recovery Tree
        uses: actions/upload-artifact@v4
        with:
          name: Recovery_Tree
          path: output/*
