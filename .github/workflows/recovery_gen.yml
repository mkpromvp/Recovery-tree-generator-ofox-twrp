name: Recovery Tree Generator NO CHECK

on:
  workflow_dispatch:
    inputs:
      boot_url:
        description: 'boot.img link'
        required: true
      vendor_boot_url:
        description: 'vendor_boot.img link (optional)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip cpio gzip xz-utils curl wget git

          pip3 install twrpdtgen

      - name: Install AIK 🔥
        run: |
          git clone https://github.com/osm0sis/Android-Image-Kitchen.git AIK
          chmod -R +x AIK

      - name: Download boot
        run: |
          echo "Downloading boot..."
          curl -L "${{ github.event.inputs.boot_url }}" -o boot.img || true

      - name: Download vendor_boot
        run: |
          if [ -n "${{ github.event.inputs.vendor_boot_url }}" ]; then
            echo "Downloading vendor_boot..."
            curl -L "${{ github.event.inputs.vendor_boot_url }}" -o vendor_boot.img || true
          fi

      - name: Unpack boot (AIK)
        run: |
          cd AIK
          ./unpackimg.sh ../boot.img || true
          cd ..

      - name: Generate Tree
        run: |
          mkdir -p output

          if [ -f "vendor_boot.img" ]; then
            python3 -m twrpdtgen boot.img --vendor_boot vendor_boot.img --output output/ || true
          else
            python3 -m twrpdtgen boot.img --output output/ || true
          fi

      - name: Dump everything 🔥
        run: |
          mkdir -p output/all

          cp -r AIK/* output/all/ 2>/dev/null || true
          cp -r * output/all/ 2>/dev/null || true

          echo "FILES:"
          ls -R output

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RESULT
          path: output/
